name: 定时检查网盘更新

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: netdisk-auto-sync
  cancel-in-progress: false

jobs:
  wake-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检查配置
        shell: bash
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$RENDER_URL" || (echo "缺少 RENDER_URL Secret" && exit 1)
          test -n "$CRON_SECRET" || (echo "缺少 CRON_SECRET Secret" && exit 1)

      - name: 唤醒 Render
        shell: bash
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "$RENDER_URL/healthz" >/dev/null; then
              echo "Render 已唤醒"
              exit 0
            fi
            echo "等待 Render 冷启动：$i/30"
            sleep 10
          done
          echo "Render 唤醒失败"
          exit 1

      - name: 启动到期追更任务
        shell: bash
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$RENDER_URL/api/cron/run"

      - name: 等待任务结束并保持服务唤醒
        shell: bash
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ]; then
            for i in {1..12}; do
              curl --silent --max-time 20 "$RENDER_URL/healthz" >/dev/null || true
              sleep 30
            done
            exit 0
          fi
          for i in {1..35}; do
            BODY=$(curl --fail --silent --show-error --max-time 20 \
              -u "$ADMIN_USER:$ADMIN_PASSWORD" \
              "$RENDER_URL/api/job-state") || true
            echo "$BODY"
            if echo "$BODY" | grep -q '"running": false'; then
              exit 0
            fi
            sleep 30
          done
          echo "任务仍在运行，下一次计划任务会继续唤醒服务"
