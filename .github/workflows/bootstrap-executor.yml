name: Bootstrap netdisk executor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-executor.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch keepalive workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run .github/workflows/executor-keepalive.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
