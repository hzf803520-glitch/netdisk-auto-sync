name: Netdisk executor keepalive

on:
  schedule:
    - cron: "3-53/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: netdisk-executor-keepalive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=netdisk-sync-executor-v2"
          )"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${response}")"
          echo "::add-mask::${token}"
          printf 'token=%s\n' "${token}" >>"${GITHUB_OUTPUT}"

      - name: Keep Render awake and run due jobs
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 250 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"waitSeconds":240}' \
            https://netdisk-sync-executor-v2.onrender.com/v1/maintenance/run

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m)"
          path=".github/executor-heartbeat.txt"
          current="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --jq '.content' 2>/dev/null \
            | tr -d '\n' \
            | base64 --decode 2>/dev/null \
            || true
          )"
          if [ "${current}" = "${stamp}" ]; then
            exit 0
          fi
          encoded="$(printf '%s' "${stamp}" | base64 -w0)"
          sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --jq '.sha' 2>/dev/null \
            || true
          )"
          args=(
            -X PUT
            -f "message=chore: keep executor schedule active (${stamp})"
            -f "content=${encoded}"
          )
          if [ -n "${sha}" ]; then
            args+=(-f "sha=${sha}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" "${args[@]}" >/dev/null
