name: Extract provider source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-provider-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/app
          mkdir -p /tmp/app
          cat deploy-source/app-lite.part* | base64 -d | tar -xz -C /tmp/app
      - name: Copy relevant source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/extracted/app/api/providers/config
          mkdir -p diagnostics/extracted/app/components
          mkdir -p diagnostics/extracted/lib
          cp /tmp/app/app/api/providers/config/route.ts diagnostics/extracted/app/api/providers/config/route.ts
          cp /tmp/app/app/components/netdisk-setup.tsx diagnostics/extracted/app/components/netdisk-setup.tsx
          cp /tmp/app/lib/db.ts diagnostics/extracted/lib/db.ts
          cp /tmp/app/lib/secrets.ts diagnostics/extracted/lib/secrets.ts
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/extracted
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "diagnostics: extract provider save source [skip ci]"
          git push

# Trigger extraction after the workflow exists on the default branch.
