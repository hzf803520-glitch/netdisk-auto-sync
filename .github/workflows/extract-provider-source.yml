name: Validate provider save fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-provider-source.yml"
      - "Dockerfile"
      - "overrides/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/app
          mkdir -p /tmp/app
          cat deploy-source/app-lite.part* | base64 -d | tar -xz -C /tmp/app
      - name: Apply provider fixes
        shell: bash
        run: |
          set -euo pipefail
          cp overrides/app/api/providers/config/route.ts /tmp/app/app/api/providers/config/route.ts
          cp overrides/app/components/netdisk-setup.tsx /tmp/app/app/components/netdisk-setup.tsx
          cp overrides/lib/secrets.ts /tmp/app/lib/secrets.ts
      - name: Install and build
        working-directory: /tmp/app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
      - name: Record successful build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf 'commit=%s\nstatus=build-success\n' "${GITHUB_SHA}" > diagnostics/provider-fix-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/provider-fix-build.txt
          git commit -m "ci: provider fix build passed [skip ci]"
          git push
