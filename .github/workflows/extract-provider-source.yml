name: Validate provider save fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-provider-source.yml"
      - "Dockerfile"
      - "overrides/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/app
          mkdir -p /tmp/app
          cat deploy-source/app-lite.part* | base64 -d | tar -xz -C /tmp/app
          cp overrides/app/api/providers/config/route.ts /tmp/app/app/api/providers/config/route.ts
          cp overrides/app/components/netdisk-setup.tsx /tmp/app/app/components/netdisk-setup.tsx
          cp overrides/lib/secrets.ts /tmp/app/lib/secrets.ts
      - name: Build and capture result
        id: build
        working-directory: /tmp/app
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/provider-build.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npm run build >> /tmp/provider-build.log 2>&1
            build_status=$?
          else
            build_status=$install_status
          fi
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record build output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'status=%s\n\n' "${{ steps.build.outputs.status }}"
            tail -n 300 /tmp/provider-build.log
          } > diagnostics/provider-fix-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/provider-fix-build.log
          git commit -m "ci: record provider fix build result [skip ci]"
          git push
      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        shell: bash
        run: exit 1
