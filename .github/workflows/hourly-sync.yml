name: 每小时检查网盘更新

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 唤醒 Render 并触发追更
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          test -n "$RENDER_URL" || {
            echo "缺少 RENDER_URL"
            exit 1
          }

          test -n "$CRON_SECRET" || {
            echo "缺少 CRON_SECRET"
            exit 1
          }

          BASE="${RENDER_URL%/}"

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            "$BASE/api/cron/hourly?secret=$CRON_SECRET"

          echo

      - name: 等待追更任务完成
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE="${RENDER_URL%/}"

          for i in $(seq 1 30); do
            sleep 30

            RESPONSE=$(curl --fail --silent --show-error \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 120 \
              "$BASE/api/cron/status?secret=$CRON_SECRET")

            echo "第 $i 次状态检查：$RESPONSE"

            ACTIVE=$(python -c \
              'import json,sys; print(int(json.load(sys.stdin).get("active", 1)))' \
              <<< "$RESPONSE")

            if [ "$ACTIVE" -eq 0 ]; then
              echo "本轮追更任务已完成"
              exit 0
            fi
          done

          echo "任务仍在运行，下一小时继续检查"
