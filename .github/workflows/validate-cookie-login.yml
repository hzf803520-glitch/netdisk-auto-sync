name: Validate cookie login

on:
  push:
    branches:
      - agent/cookie-login
  pull_request:
    paths:
      - "hub/**"
      - "render.yaml"
      - ".github/workflows/validate-cookie-login.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q hub
