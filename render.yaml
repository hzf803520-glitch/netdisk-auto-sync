services:
  - type: web
    runtime: docker
    name: netdisk-sync-executor-v2
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.executor
    dockerContext: .
    healthCheckPath: /livez
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: EXECUTOR_TOKEN
        generateValue: true
      - key: EXECUTOR_MASTER_KEY
        generateValue: true
      - key: EXECUTOR_DATA_DIR
        value: /var/lib/netdisk-executor
      - key: EXECUTOR_SOURCE_URL
        value: https://github.com/hzf803520-glitch/netdisk-auto-sync/tree/executor-v2
      - key: TZ
        value: Asia/Shanghai
    disk:
      name: executor-data
      mountPath: /var/lib/netdisk-executor
      sizeGB: 5
