services:
  - type: web
    name: netdisk-auto-sync
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CREDENTIAL_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FIRECRAWL_API_URL
        sync: false
      - key: SYNC_CONCURRENCY
        value: 3
