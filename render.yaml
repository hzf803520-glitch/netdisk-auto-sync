services:
  - type: web
    runtime: docker
    name: netdisk-sync-executor-v2
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.executor
    dockerContext: .
    healthCheckPath: /livez
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: EXECUTOR_TOKEN
        generateValue: true
      - key: EXECUTOR_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EXECUTOR_REQUIRE_POSTGRES
        value: "true"
      - key: EXECUTOR_DATA_DIR
        value: /tmp/netdisk-executor
      - key: EXECUTOR_CHECK_INTERVAL_MINUTES
        value: "5"
      - key: GITHUB_WAKE_REPOSITORY
        value: hzf803520-glitch/netdisk-auto-sync
      - key: GITHUB_WAKE_WORKFLOW
        value: .github/workflows/executor-keepalive.yml
      - key: GITHUB_WAKE_REF
        value: refs/heads/main
      - key: EXECUTOR_SOURCE_URL
        value: https://github.com/hzf803520-glitch/netdisk-auto-sync/tree/executor-v2
      - key: TZ
        value: Asia/Shanghai
