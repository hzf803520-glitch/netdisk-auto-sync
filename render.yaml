services:
  - type: web
    name: netdisk-auto-sync
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m compileall -q hub
    startCommand: python hub/cookie_login_app.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BAIDU_TRANSFER_DIR
        value: /资源数据
      - key: WPS_APP_ID
        sync: false
      - key: WPS_APP_KEY
        sync: false
      - key: WPS_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: RESOURCE_API_URL
        sync: false
      - key: RESOURCE_API_TOKEN
        sync: false
