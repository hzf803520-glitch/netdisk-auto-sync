<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网盘自动转存与追更系统 V3</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--primary:#4f46e5;--ok:#059669;--warn:#b45309;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{padding:27px 5vw;background:linear-gradient(135deg,#111827,#4338ca);color:#fff}header h1{margin:0 0 8px;font-size:27px}header p{margin:0;opacity:.88}main{max-width:1500px;margin:20px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 8px 28px rgba(16,24,40,.04)}h3{margin:0 0 11px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:9px 10px;font-size:14px}textarea{min-height:105px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--primary);color:#fff}.ok{background:var(--ok);color:#fff}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fee4e2;color:#912018}.warn{background:#fff4e5;color:#92400e}.muted{color:var(--muted);font-size:13px}.notice{padding:11px;border-radius:10px;background:#ecfdf3;color:#05603a;font-size:13px}.status{padding:12px;border-radius:10px;background:#f2f4f7;white-space:pre-wrap;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:1450px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#fafafa;white-space:nowrap}.url{max-width:240px;word-break:break-all}.pathbox{display:flex;gap:5px;min-width:245px}.pathbox input{padding:7px}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#f2f4f7}.update_available{color:var(--warn)}.success,.no_change{color:var(--ok)}.failed,.check_failed{color:var(--bad)}.running{color:var(--primary)}.changes{max-width:270px;white-space:pre-wrap;word-break:break-word}.cred-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px}@media(max-width:800px){.cred-grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>网盘自动转存与追更系统 V3</h1><p>自动创建目标目录、显示文件变化，并只同步检测到更新的电视剧或动漫。</p></header><main>
<div class="grid">
<section class="card"><h3>① 导入剧名和分享链接</h3><div class="field"><label>自动检查周期</label><select id="interval"><option value="15">每15分钟</option><option value="30">每30分钟</option><option value="60" selected>每小时</option><option value="180">每3小时</option><option value="360">每6小时</option><option value="1440">每天</option></select></div><div class="field"><label>粘贴文档内容</label><textarea id="importText" placeholder="千香 https://pan.quark.cn/s/xxxx"></textarea></div><button class="btn primary" onclick="importText()">解析并保存</button><div class="field"><label>上传 TXT / CSV / XLSX / DOCX</label><input id="file" type="file"></div><button class="btn secondary" onclick="uploadFile()">上传并导入</button></section>
<section class="card"><h3>② 网盘登录凭证</h3><div class="notice">Cookie/Token 加密保存在 Neon，Render 休眠、重启和重新部署后不会丢失。</div><div class="field"><label>平台</label><select id="manualPlatform" onchange="credMode()"><option value="baidu">百度网盘 Cookie</option><option value="quark">夸克网盘 Cookie</option><option value="uc">UC网盘 Cookie</option><option value="xunlei">迅雷 Token</option></select></div><div id="cookieFields"><div class="field"><label>Cookie</label><textarea id="manualCookie" placeholder="粘贴完整 Cookie"></textarea></div></div><div id="tokenFields" style="display:none"><div class="field"><label>Refresh Token</label><input id="refreshToken"></div><div class="field"><label>Access Token</label><input id="accessToken"></div></div><button class="btn ok" onclick="saveCredential()">保存凭证</button><div id="credentialState" class="status" style="margin-top:9px">正在读取…</div></section>
<section class="card"><h3>③ 更新检查与同步</h3><div id="jobState" class="status">正在读取状态…</div><div class="actions"><button class="btn secondary" onclick="checkAll()">检查全部更新</button><button class="btn ok" onclick="syncUpdates()">同步全部有更新</button><button class="btn secondary" onclick="loadAll()">刷新</button><a class="btn secondary" href="/api/export.csv">导出新链接</a></div><details style="margin-top:12px"><summary>高级操作</summary><p class="muted">完整重转会重新处理所有资源，通常不需要使用。</p><button class="btn danger" onclick="fullAll()">完整重新转存全部</button></details></section>
</div>
<section class="card"><h3>资源对应与更新情况</h3><div class="table-wrap"><table><thead><tr><th>剧名</th><th>平台</th><th>原链接</th><th>目标目录</th><th>变化</th><th>我的新链接</th><th>状态</th><th>操作</th></tr></thead><tbody id="resources"></tbody></table></div></section>
<section class="card"><h3>运行日志</h3><div class="table-wrap"><table style="min-width:900px"><thead><tr><th>时间</th><th>动作</th><th>资源</th><th>内容</th></tr></thead><tbody id="logs"></tbody></table></div></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const names={baidu:'百度',quark:'夸克',uc:'UC',xunlei:'迅雷'};async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j;try{j=await r.json()}catch(e){throw new Error('后台返回格式错误')}if(!r.ok||!j.success)throw new Error(j.message||'操作失败');return j}function toast(x){alert(x)}
function credMode(){const x=document.getElementById('manualPlatform').value;document.getElementById('cookieFields').style.display=x==='xunlei'?'none':'block';document.getElementById('tokenFields').style.display=x==='xunlei'?'block':'none'}
async function saveCredential(){try{const p=document.getElementById('manualPlatform').value;await api('/api/credentials/'+p,{method:'POST',body:JSON.stringify({credentials:{cookie:document.getElementById('manualCookie').value,refresh_token:document.getElementById('refreshToken').value,access_token:document.getElementById('accessToken').value}})});document.getElementById('manualCookie').value='';document.getElementById('refreshToken').value='';document.getElementById('accessToken').value='';toast('已加密保存');loadCredentials()}catch(e){toast(e.message)}}
async function loadCredentials(){const j=await api('/api/credentials');document.getElementById('credentialState').innerHTML=Object.keys(names).map(p=>{const c=j.items.find(x=>x.platform===p);return `${names[p]}：${c?'✅ 已保存 '+esc(c.updated_at):'未保存'}`}).join('<br>')}
async function importText(){try{const text=document.getElementById('importText').value;if(!text.trim())throw new Error('请粘贴内容');const j=await api('/api/import/text',{method:'POST',body:JSON.stringify({text,interval_minutes:Number(document.getElementById('interval').value)})});toast(`新增 ${j.result.inserted}，更新 ${j.result.updated}`);loadAll()}catch(e){toast(e.message)}}
async function uploadFile(){try{const f=document.getElementById('file').files[0];if(!f)throw new Error('请选择文件');const fd=new FormData();fd.append('file',f);fd.append('interval_minutes',document.getElementById('interval').value);const r=await fetch('/api/import/file',{method:'POST',body:fd});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'上传失败');toast('导入完成');loadAll()}catch(e){toast(e.message)}}
function changeText(x){let c={};try{c=JSON.parse(x.changes_json||'{}')}catch(e){};const a=(c.added||[]).map(v=>'＋ '+(v.path||v.name)).slice(0,5);const m=(c.modified||[]).map(v=>'～ '+(v.path||v.name)).slice(0,5);const d=(c.deleted||[]).map(v=>'－ '+(v.path||v.name)).slice(0,5);const all=[...a,...m,...d];return all.length?all.join('\n')+(a.length+m.length+d.length>15?'\n…':''):(x.last_check?'没有变化':'尚未检查')}
async function loadResources(){const j=await api('/api/resources');document.getElementById('resources').innerHTML=j.items.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.source_title||'')}</span></td><td><span class="tag">${esc(names[x.platform]||x.platform)}</span></td><td class="url"><a href="${esc(x.source_url)}" target="_blank">${esc(x.source_url)}</a></td><td><div class="pathbox"><input id="path-${x.id}" value="${esc(x.target_path||'/资源/'+x.title)}"><button class="btn secondary" onclick="saveTarget(${x.id})">保存</button></div><span class="muted">不存在时自动创建</span></td><td class="changes">${esc(changeText(x))}</td><td class="url">${x.target_url?`<a href="${esc(x.target_url)}" target="_blank">${esc(x.target_url)}</a>`:'尚未生成'}</td><td class="${esc(x.status)}">${x.has_updates?'🟠 有更新':'🟢'} ${esc(x.last_message||x.status)}<br><span class="muted">检查：${esc(x.last_check||'-')}</span></td><td><div class="actions"><button class="btn secondary" onclick="one(${x.id},'check')">检查更新</button><button class="btn ok" onclick="one(${x.id},'sync')">同步更新</button><button class="btn warn" onclick="one(${x.id},'full')">完整重转</button><button class="btn danger" onclick="removeOne(${x.id})">删除记录</button></div></td></tr>`).join('')||'<tr><td colspan="8">暂无资源</td></tr>'}
async function loadLogs(){const j=await api('/api/logs');document.getElementById('logs').innerHTML=j.items.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.title||'-')}</td><td>${esc(x.message)}</td></tr>`).join('')}
async function loadJob(){const j=await api('/api/job-state');const x=j.state;document.getElementById('jobState').textContent=`${x.message}\n进度 ${x.done||0}/${x.total||0}　同步 ${x.updated||0}　无变化 ${x.skipped||0}　失败 ${x.failed||0}`}
async function saveTarget(id){try{const j=await api('/api/resources/'+id+'/target',{method:'POST',body:JSON.stringify({target_path:document.getElementById('path-'+id).value})});toast(j.message);loadResources()}catch(e){toast(e.message)}}
async function one(id,a){try{const j=await api('/api/resources/'+id+'/'+a,{method:'POST',body:'{}'});toast(j.message);setTimeout(loadAll,1000)}catch(e){toast(e.message)}}
async function checkAll(){try{const j=await api('/api/check-all',{method:'POST',body:'{}'});toast(j.message)}catch(e){toast(e.message)}}async function syncUpdates(){try{const j=await api('/api/sync-updates',{method:'POST',body:'{}'});toast(j.message)}catch(e){toast(e.message)}}async function fullAll(){if(!confirm('确认完整重新转存全部资源？'))return;try{const j=await api('/api/full-all',{method:'POST',body:'{}'});toast(j.message)}catch(e){toast(e.message)}}
async function removeOne(id){if(!confirm('只删除后台记录，不删除网盘文件，确认吗？'))return;await api('/api/resources/'+id,{method:'DELETE'});loadAll()}
async function loadAll(){try{await Promise.all([loadCredentials(),loadResources(),loadLogs(),loadJob()])}catch(e){document.getElementById('jobState').textContent=e.message}}loadAll();setInterval(()=>{loadJob();loadResources();loadLogs()},10000);
</script></body></html>
